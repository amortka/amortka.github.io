<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adam Mortka</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background: #f2ece3;
            font-family: 'Inter', -apple-system, sans-serif;
            color: #1a1a18;
            -webkit-font-smoothing: antialiased;
        }

        canvas#topo {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        .ui {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* Top bar */
        .top-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.8rem 2.5rem;
        }

        .logo {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            opacity: 0;
        }

        .logo span {
            font-weight: 300;
            opacity: 0.4;
            margin-left: 0.4em;
            font-size: 0.7rem;
        }

        nav {
            display: flex;
            gap: 2.5rem;
            pointer-events: all;
        }

        nav a {
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #1a1a18;
            text-decoration: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        nav a:hover { opacity: 0.5 !important; }

        .time {
            font-size: 0.65rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            color: #c45a2d;
            opacity: 0;
        }

        /* Hero */
        .hero {
            position: absolute;
            top: 50%;
            left: 2.5rem;
            transform: translateY(-55%);
        }

        .hero-label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1.2rem;
            opacity: 0;
        }

        .hero-label .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #c45a2d;
        }

        .hero-label span {
            font-size: 0.6rem;
            font-weight: 500;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #6b6560;
        }

        .hero-name {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: clamp(4rem, 12vw, 11rem);
            line-height: 0.88;
            letter-spacing: -0.02em;
            color: #1a1a18;
            overflow: hidden;
        }

        .hero-name .line {
            display: block;
            overflow: hidden;
        }

        .hero-name .line-inner {
            display: block;
            transform: translateY(110%);
        }

        .hero-surname {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-style: italic;
            font-size: clamp(3.5rem, 10vw, 9rem);
            line-height: 0.95;
            letter-spacing: -0.01em;
            color: #c45a2d;
            margin-top: 0.05em;
            overflow: hidden;
        }

        .hero-surname .line {
            display: block;
            overflow: hidden;
        }

        .hero-surname .line-inner {
            display: block;
            transform: translateY(110%);
        }

        /* Right text */
        .tagline {
            position: absolute;
            right: 2.5rem;
            top: 50%;
            transform: translateY(-50%);
            text-align: right;
            opacity: 0;
        }

        .tagline p {
            font-size: 0.9rem;
            font-weight: 300;
            line-height: 1.7;
            color: #4a4540;
        }

        /* Bottom bar */
        .bottom-bar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.8rem 2.5rem;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            opacity: 0;
        }

        .status .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #c45a2d;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .status span {
            font-size: 0.6rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #6b6560;
        }

        .coords {
            font-size: 0.6rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            color: #9b9590;
            opacity: 0;
        }

        .scroll-hint {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            opacity: 0;
            pointer-events: all;
            cursor: pointer;
        }

        .scroll-hint span {
            font-size: 0.6rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #6b6560;
        }

        .scroll-hint .arrow {
            font-size: 0.7rem;
            color: #6b6560;
        }

        /* Red cursor dot */
        .cursor-dot {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #c45a2d;
            pointer-events: none;
            z-index: 100;
            opacity: 0;
            transform: translate(-50%, -50%);
        }

        /* Tablet */
        @media (max-width: 1024px) {
            .tagline { display: none; }
            .hero-name { font-size: clamp(3rem, 10vw, 7rem); }
            .hero-surname { font-size: clamp(2.5rem, 8vw, 6rem); }
        }

        /* Mobile */
        @media (max-width: 768px) {
            .tagline { display: none; }
            .hero {
                left: 1.2rem;
                right: 1.2rem;
                transform: translateY(-50%);
            }
            .hero-name { font-size: clamp(2.8rem, 14vw, 5rem); }
            .hero-surname { font-size: clamp(2.2rem, 12vw, 4.5rem); }
            .hero-label span { font-size: 0.5rem; }
            .top-bar {
                padding: 1.2rem 1.2rem;
                flex-wrap: wrap;
                gap: 0.5rem;
            }
            .bottom-bar {
                padding: 1.2rem 1.2rem;
                flex-wrap: wrap;
                gap: 0.8rem;
            }
            nav { gap: 1.2rem; }
            nav a { font-size: 0.55rem; }
            .logo { font-size: 0.7rem; }
            .time { font-size: 0.55rem; }
            .status span, .coords, .scroll-hint span { font-size: 0.5rem; }
            .cursor-dot { display: none; }
        }

        /* Small mobile */
        @media (max-width: 400px) {
            .hero-name { font-size: clamp(2rem, 16vw, 3.5rem); }
            .hero-surname { font-size: clamp(1.8rem, 14vw, 3rem); }
            .top-bar { flex-direction: column; align-items: flex-start; gap: 0.6rem; }
            .coords { display: none; }
            .scroll-hint { display: none; }
        }
    </style>
</head>
<body>
    <canvas id="topo"></canvas>

    <div class="cursor-dot" id="cursorDot"></div>

    <div class="ui">
        <div class="top-bar">
            <div class="logo">A.M<span>2026</span></div>
            <!-- <nav>
                <a href="projects/gdziepisac/">WORK</a>
                <a href="#">ABOUT</a>
                <a href="#">CONTACT</a>
            </nav> -->
            <div class="time" id="clock"></div>
        </div>

        <div class="hero">
            <div class="hero-label">
                <div class="dot"></div>
                <span>Creative Developer</span>
            </div>
            <div class="hero-name">
                <span class="line"><span class="line-inner">ADAM</span></span>
            </div>
            <div class="hero-surname">
                <span class="line"><span class="line-inner">Mortka</span></span>
            </div>
        </div>

        <div class="tagline">
            <p>Crafting digital<br>experiences with code.</p>
        </div>

        <div class="bottom-bar">
            <div class="status">
                <div class="dot"></div>
                <span>Available for projects</span>
            </div>
            <div class="coords">51.1079&deg; N / 17.0385&deg; E</div>
            <div class="scroll-hint">
                <span>Explore</span>
                <span class="arrow">&darr;</span>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
// ── Clock ──
function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('clock').textContent = h + ' : ' + m + '  WROCŁAW, PL';
}
updateClock();
setInterval(updateClock, 10000);

// ── Cursor dot ──
const cursorDot = document.getElementById('cursorDot');
let cursorX = window.innerWidth / 2, cursorY = window.innerHeight / 2;
let dotX = cursorX, dotY = cursorY;

document.addEventListener('mousemove', e => {
    cursorX = e.clientX;
    cursorY = e.clientY;
});

function animateDot() {
    dotX += (cursorX - dotX) * 0.08;
    dotY += (cursorY - dotY) * 0.08;
    cursorDot.style.left = dotX + 'px';
    cursorDot.style.top = dotY + 'px';
    requestAnimationFrame(animateDot);
}
animateDot();

// ── Three.js Topo Shader ──
const canvas = document.getElementById('topo');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const vertexShader = `
varying vec2 vUv;
void main() {
    vUv = uv;
    gl_Position = vec4(position, 1.0);
}`;

const fragmentShader = `
precision highp float;

varying vec2 vUv;
uniform vec2 u_resolution;
uniform float u_time;
uniform vec2 u_mouse;

//
// Simplex 2D noise
//
vec3 mod289(vec3 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec2 mod289(vec2 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

float snoise(vec2 v) {
    const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                       -0.577350269189626, 0.024390243902439);
    vec2 i  = floor(v + dot(v, C.yy));
    vec2 x0 = v - i + dot(i, C.xx);
    vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
    vec4 x12 = x0.xyxy + C.xxzz;
    x12.xy -= i1;
    i = mod289(i);
    vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
    vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
    m = m*m; m = m*m;
    vec3 x = 2.0 * fract(p * C.www) - 1.0;
    vec3 h = abs(x) - 0.5;
    vec3 ox = floor(x + 0.5);
    vec3 a0 = x - ox;
    m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
    vec3 g;
    g.x = a0.x * x0.x + h.x * x0.y;
    g.yz = a0.yz * x12.xz + h.yz * x12.yw;
    return 130.0 * dot(m, g);
}

// Smooth FBM with domain rotation — 5 octaves, low base frequency
float fbm(vec2 p) {
    float val = 0.0;
    float amp = 0.5;
    mat2 rot = mat2(0.866, 0.5, -0.5, 0.866);
    for (int i = 0; i < 5; i++) {
        val += amp * snoise(p);
        p = rot * p * 2.0;
        amp *= 0.5;
    }
    return val;
}

void main() {
    vec2 uv = vUv;
    float ar = u_resolution.x / u_resolution.y;
    vec2 p = vec2(uv.x * ar, uv.y);

    // Mouse in aspect space
    vec2 mouse = vec2(u_mouse.x * ar, u_mouse.y);
    vec2 toMouse = p - mouse;
    float mDist = length(toMouse);

    // Continuous slow drift — terrain always morphing
    float t = u_time * 0.06;

    // Mouse deforms terrain — pushes contours away like a hill rising under cursor
    float mouseRadius = exp(-mDist * mDist * 4.0);  // gaussian falloff
    vec2 mouseWarp = -toMouse * mouseRadius * 0.35;  // push outward from cursor
    float mouseElevation = mouseRadius * 0.4;        // raise terrain at cursor

    // Base terrain position with slow drift
    vec2 tp = (p + mouseWarp) * 0.7 + vec2(t * 0.5, t * 0.35);

    // Domain warp — slow swirling
    vec2 warp = vec2(
        snoise(tp * 0.8 + vec2(3.1, 7.2) + t * 0.2) * 0.3,
        snoise(tp * 0.8 + vec2(9.4, 1.6) + t * 0.15) * 0.3
    );
    float terrain = fbm(tp + warp) + mouseElevation;

    // Contour lines — 10 levels for clean spacing
    float levels = 10.0;
    float h = terrain * levels;
    float dh = fwidth(h);

    // Minor lines: thin, clean
    float minorD = abs(fract(h + 0.5) - 0.5);
    float minorLine = 1.0 - smoothstep(0.0, max(dh * 1.5, 0.02), minorD);

    // Major lines: every 3rd level, slightly thicker
    float majorH = h / 3.0;
    float majorD = abs(fract(majorH + 0.5) - 0.5);
    float majorDh = fwidth(majorH);
    float majorLine = 1.0 - smoothstep(0.0, max(majorDh * 2.0, 0.015), majorD);

    // Single red accent contour at specific elevation
    float redDist = abs(h - 3.0);
    float redLine = 1.0 - smoothstep(0.0, max(dh * 2.5, 0.025), redDist);

    // Clean beige/cream background
    vec3 paper = vec3(0.949, 0.929, 0.894);

    // Very subtle elevation shading
    float elev = smoothstep(-1.0, 1.0, terrain);
    paper += (elev - 0.5) * 0.015;

    // Line colors
    vec3 thinColor = vec3(0.78, 0.74, 0.68);
    vec3 thickColor = vec3(0.60, 0.55, 0.48);
    vec3 redColor = vec3(0.78, 0.28, 0.15);

    // Compose — clean layering
    vec3 color = paper;
    color = mix(color, thinColor, minorLine * 0.28);
    color = mix(color, thickColor, majorLine * 0.50);
    color = mix(color, redColor, redLine * 0.80);

    // Warm glow at cursor
    color += vec3(0.08, 0.04, 0.0) * mouseRadius * 0.6;

    // Gentle vignette
    float vig = 1.0 - dot((uv - 0.5) * 0.9, (uv - 0.5) * 0.9);
    color *= smoothstep(0.0, 0.5, vig) * 0.08 + 0.92;

    gl_FragColor = vec4(color, 1.0);
}`;

const uniforms = {
    u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    u_time: { value: 0 },
    u_mouse: { value: new THREE.Vector2(0.5, 0.5) }
};

const material = new THREE.ShaderMaterial({
    vertexShader,
    fragmentShader,
    uniforms
});

const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
scene.add(mesh);

// ── Mouse tracking ──
let mouseTarget = { x: 0.5, y: 0.5 };
let mouseCurrent = { x: 0.5, y: 0.5 };

document.addEventListener('mousemove', e => {
    mouseTarget.x = e.clientX / window.innerWidth;
    mouseTarget.y = 1.0 - e.clientY / window.innerHeight;
});

document.addEventListener('touchmove', e => {
    const t = e.touches[0];
    mouseTarget.x = t.clientX / window.innerWidth;
    mouseTarget.y = 1.0 - t.clientY / window.innerHeight;
}, { passive: true });

// ── Resize ──
window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
});

// ── Render loop ──
const clock = new THREE.Clock();

function render() {
    const elapsed = clock.getElapsedTime();

    // Very smooth mouse easing
    mouseCurrent.x += (mouseTarget.x - mouseCurrent.x) * 0.025;
    mouseCurrent.y += (mouseTarget.y - mouseCurrent.y) * 0.025;

    uniforms.u_time.value = elapsed;
    uniforms.u_mouse.value.set(mouseCurrent.x, mouseCurrent.y);

    renderer.render(scene, camera);
    requestAnimationFrame(render);
}
render();

// ── GSAP entrance animations ──
const tl = gsap.timeline({ defaults: { ease: 'power3.out' }});

tl.to('.hero-name .line-inner', {
    y: '0%',
    duration: 1.4,
    delay: 0.3
})
.to('.hero-surname .line-inner', {
    y: '0%',
    duration: 1.4,
}, '-=1.0')
.to('.hero-label', {
    opacity: 1,
    duration: 0.8,
}, '-=0.8')
.to('.logo', {
    opacity: 1,
    duration: 0.8,
}, '-=0.6')
.to('nav a', {
    opacity: 0.7,
    duration: 0.6,
    stagger: 0.1
}, '-=0.5')
.to('.time', {
    opacity: 1,
    duration: 0.6,
}, '-=0.4')
.to('.tagline', {
    opacity: 1,
    duration: 0.8,
}, '-=0.4')
.to('.status', {
    opacity: 1,
    duration: 0.6,
}, '-=0.6')
.to('.coords', {
    opacity: 1,
    duration: 0.6,
}, '-=0.4')
.to('.scroll-hint', {
    opacity: 0.6,
    duration: 0.6,
}, '-=0.3')
.to('#cursorDot', {
    opacity: 0.8,
    duration: 0.5,
}, '-=0.3');

    </script>
</body>
</html>
