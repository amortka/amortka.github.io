<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adam Mortka</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #f5f0e8;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 10;
        }
        .name {
            font-size: clamp(2rem, 6vw, 5rem);
            font-weight: 200;
            letter-spacing: 0.15em;
            color: #2a1f0e;
            text-transform: uppercase;
            mix-blend-mode: multiply;
            opacity: 0.85;
        }
        .subtitle {
            margin-top: 0.5em;
            font-size: clamp(0.7rem, 1.5vw, 1rem);
            font-weight: 400;
            letter-spacing: 0.4em;
            color: #8b5e2f;
            text-transform: uppercase;
            mix-blend-mode: multiply;
            opacity: 0.6;
        }
        .nav {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2rem;
            z-index: 10;
            pointer-events: all;
        }
        .nav a {
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #6b4420;
            text-decoration: none;
            opacity: 0.5;
            transition: opacity 0.3s;
            font-weight: 400;
        }
        .nav a:hover { opacity: 1; }
    </style>
</head>
<body>
    <canvas id="gl"></canvas>
    <div class="overlay">
        <div class="name">Adam Mortka</div>
        <div class="subtitle">Creative Developer</div>
    </div>
    <div class="nav">
        <a href="projects/gdziepisac/">Projects</a>
    </div>

<script>
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', { antialias: true, alpha: false });

const vertSrc = `
attribute vec2 a_pos;
void main() {
    gl_Position = vec4(a_pos, 0.0, 1.0);
}`;

const fragSrc = `
precision highp float;

uniform vec2 u_resolution;
uniform float u_time;
uniform vec2 u_mouse;

// Simplex-like noise
vec3 mod289(vec3 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec2 mod289(vec2 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

float snoise(vec2 v) {
    const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                       -0.577350269189626, 0.024390243902439);
    vec2 i  = floor(v + dot(v, C.yy));
    vec2 x0 = v - i + dot(i, C.xx);
    vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
    vec4 x12 = x0.xyxy + C.xxzz;
    x12.xy -= i1;
    i = mod289(i);
    vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
    vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
    m = m*m; m = m*m;
    vec3 x = 2.0 * fract(p * C.www) - 1.0;
    vec3 h = abs(x) - 0.5;
    vec3 ox = floor(x + 0.5);
    vec3 a0 = x - ox;
    m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
    vec3 g;
    g.x = a0.x * x0.x + h.x * x0.y;
    g.yz = a0.yz * x12.xz + h.yz * x12.yw;
    return 130.0 * dot(m, g);
}

float fbm(vec2 p) {
    float val = 0.0;
    float amp = 0.5;
    float freq = 1.0;
    for (int i = 0; i < 6; i++) {
        val += amp * snoise(p * freq);
        freq *= 2.0;
        amp *= 0.5;
    }
    return val;
}

void main() {
    vec2 uv = gl_FragCoord.xy / u_resolution;
    vec2 aspect = vec2(u_resolution.x / u_resolution.y, 1.0);
    vec2 p = uv * aspect;

    // Mouse influence
    vec2 mouse = u_mouse * aspect;
    float mouseDist = length(p - mouse);
    float mouseInfluence = exp(-mouseDist * 2.5) * 0.6;

    // Animated terrain
    float t = u_time * 0.08;
    vec2 offset = vec2(t * 0.3, t * 0.2);

    // Warp space near cursor
    vec2 warp = p + vec2(
        snoise(p * 1.5 + offset) * 0.15,
        snoise(p * 1.5 + offset + 100.0) * 0.15
    );
    warp += (mouse - p) * mouseInfluence * 0.4;

    // Multi-scale terrain
    float terrain = fbm(warp * 2.0 + offset);
    terrain += fbm(warp * 4.0 - offset * 0.5) * 0.3;

    // Add ripple near cursor
    float ripple = sin(mouseDist * 25.0 - u_time * 2.0) * exp(-mouseDist * 3.0) * 0.15;
    terrain += ripple;

    // Isolines - fewer, sparser
    float levels = 12.0;
    float terrainScaled = terrain * levels;
    float isoline = abs(fract(terrainScaled) - 0.5);
    float line = 1.0 - smoothstep(0.0, 0.06, isoline);

    // Major lines every 4 levels
    float majorLine = abs(fract(terrainScaled / 4.0) - 0.5);
    float major = 1.0 - smoothstep(0.0, 0.04, majorLine);

    // Single red isoline at specific elevation
    float redLevel = 7.0;
    float redDist = abs(terrainScaled - redLevel);
    float redLine = 1.0 - smoothstep(0.0, 0.12, redDist);

    // Colors
    vec3 lineColor = vec3(0.72, 0.38, 0.08);       // dark orange
    vec3 majorColor = vec3(0.55, 0.25, 0.02);      // deeper orange
    vec3 glowColor = vec3(0.85, 0.50, 0.12);       // warm glow
    vec3 redColor = vec3(0.82, 0.12, 0.10);        // red accent

    // Elevation tint
    float elev = terrain * 0.5 + 0.5;
    vec3 elevTint = mix(
        vec3(0.94, 0.92, 0.88),
        vec3(0.97, 0.94, 0.90),
        elev
    );

    // Compose
    vec3 color = elevTint;
    color = mix(color, lineColor, line * 0.3);
    color = mix(color, majorColor, major * 0.5);
    color = mix(color, redColor, redLine * 0.7);

    // Cursor glow
    float glow = exp(-mouseDist * 3.0) * 0.2;
    color = mix(color, glowColor, glow);

    // Subtle vignette
    float vig = 1.0 - length((uv - 0.5) * 1.3);
    vig = smoothstep(0.0, 0.7, vig);
    color *= mix(0.85, 1.0, vig);

    gl_FragColor = vec4(color, 1.0);
}`;

// Compile shader
function createShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(s));
        return null;
    }
    return s;
}

const vs = createShader(gl.VERTEX_SHADER, vertSrc);
const fs = createShader(gl.FRAGMENT_SHADER, fragSrc);
const prog = gl.createProgram();
gl.attachShader(prog, vs);
gl.attachShader(prog, fs);
gl.linkProgram(prog);
gl.useProgram(prog);

// Fullscreen quad
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

// Uniforms
const uRes = gl.getUniformLocation(prog, 'u_resolution');
const uTime = gl.getUniformLocation(prog, 'u_time');
const uMouse = gl.getUniformLocation(prog, 'u_mouse');

let mx = 0.5, my = 0.5;
let smx = 0.5, smy = 0.5;

document.addEventListener('mousemove', e => {
    mx = e.clientX / window.innerWidth;
    my = 1.0 - e.clientY / window.innerHeight;
});

document.addEventListener('touchmove', e => {
    const t = e.touches[0];
    mx = t.clientX / window.innerWidth;
    my = 1.0 - t.clientY / window.innerHeight;
}, { passive: true });

function resize() {
    const dpr = Math.min(window.devicePixelRatio, 2);
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

function render(t) {
    // Smooth mouse
    smx += (mx - smx) * 0.05;
    smy += (my - smy) * 0.05;

    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, t * 0.001);
    gl.uniform2f(uMouse, smx, smy);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
